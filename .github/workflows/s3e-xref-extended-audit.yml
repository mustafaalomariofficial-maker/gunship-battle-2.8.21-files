name: GUNSHIP S3E extended data xref audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and verify Ghidra 11.2.1
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip'
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/ghidra.zip"
          echo 'ce4db5117da0fbaf8f33863fec4f40902f754f06b68945a59fb1c0f9b1bc461c  '"$RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          echo "GHIDRA_HOME=$RUNNER_TEMP/ghidra_11.2.1_PUBLIC" >> "$GITHUB_ENV"

      - name: Verify and extract the AArch64 code range
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/mustafaalomariofficial-maker/gunship-battle-2.8.21-files/releases/download/v2.8.21-unmodified/com.theonegames.gunshipbattle_2.8.21.apk'
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/game.apk"
          python3 - "$RUNNER_TEMP/game.apk" "$RUNNER_TEMP/code.bin" "$GITHUB_ENV" <<'PY'
          import hashlib, lzma, struct, sys, zipfile
          apk, code_path, env_path = sys.argv[1:]
          with zipfile.ZipFile(apk) as z:
              data = z.read('assets/GUNSHIP BATTLE_aarch64.s3e')
          if hashlib.sha256(data).hexdigest() != 'caa3602b4287e22c2b7b62af00dfa67c7e1cf76f47e26753c3174aedf12acf03':
              raise SystemExit('APK_PAYLOAD_HASH_MISMATCH')
          try:
              payload = lzma.decompress(data, format=lzma.FORMAT_ALONE)
          except lzma.LZMAError:
              p=data[0]; lc=p%9; r=p//9; lp=r%5; pb=r//5; ds=int.from_bytes(data[1:5],'little')
              payload=lzma.decompress(data[13:], format=lzma.FORMAT_RAW, filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          if not payload.startswith(b'XE3U') or hashlib.sha256(payload).hexdigest() != '6d0a0f004d52a249f1b7989f20a3d6e95d750de32169dc680444e4116fa2fa8a':
              raise SystemExit('XE3U_PAYLOAD_VALIDATION_FAILED')
          arch=struct.unpack_from('<H',payload,10)[0]
          fields=struct.unpack_from('<14I',payload,12)
          code_off,code_size,base=fields[2],fields[3],fields[10]
          if arch & 0xff != 15 or not code_size or code_off+code_size>len(payload):
              raise SystemExit('XE3U_CODE_RANGE_OR_ARCH_INVALID')
          open(code_path,'wb').write(payload[code_off:code_off+code_size])
          with open(env_path,'a') as f: f.write(f'S3E_BASE=0x{base:x}\n')
          print(f'VERIFIED_XE3U_ARM64 bytes={len(payload)} code_bytes={code_size} base=0x{base:x}')
          PY

      - name: Audit data-string cross references without publishing pseudocode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/project" "$RUNNER_TEMP/scripts"
          cat > "$RUNNER_TEMP/scripts/ExtendedXrefAudit.java" <<'JAVA'
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.address.Address;
          import ghidra.program.model.listing.Data;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.Instruction;
          import ghidra.program.model.listing.InstructionIterator;
          import ghidra.program.model.symbol.Reference;
          import ghidra.program.model.symbol.ReferenceIterator;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.TreeSet;
          public class ExtendedXrefAudit extends GhidraScript {
              public void run() throws Exception {
                  String[] needles = {"UserGold", "UserDiamond", "Diamond", "Gold", "HeliKey", "HeliLevel", "RequestUseGold", "RequestBuyDiamond", "ResponseUserDiamond", "Request_Heli_Production", "Request_Buy_heli_gacha", "RequestLevelupWeapon", "db_update_level_from_server", "sale_", "GetPurchases", "JoypleBillingDoPay", "Is_NetworkConnect", "RequestNetworkCheck", "RequestServerInfo", "lan"};
                  Map<String, Function> functions = new LinkedHashMap<>();
                  int stringHits = 0;
                  int xrefHits = 0;
                  for (Data d : currentProgram.getListing().getDefinedData(true)) {
                      Object value;
                      try { value=d.getValue(); } catch (Exception e) { continue; }
                      if (!(value instanceof String)) continue;
                      String text=((String)value).replace('\n',' ').replace('\r',' ');
                      List<String> matched=new ArrayList<>();
                      for (String n : needles) if (text.toLowerCase(Locale.ROOT).contains(n.toLowerCase(Locale.ROOT))) matched.add(n);
                      if (matched.isEmpty()) continue;
                      stringHits++;
                      ReferenceIterator refs=currentProgram.getReferenceManager().getReferencesTo(d.getAddress());
                      int localRefs=0;
                      Set<String> callers=new TreeSet<>();
                      while (refs.hasNext()) {
                          Reference r=refs.next(); localRefs++; xrefHits++;
                          Function f=currentProgram.getFunctionManager().getFunctionContaining(r.getFromAddress());
                          if (f!=null) { String key=f.getEntryPoint().toString(); functions.put(key,f); callers.add(key+":"+f.getName()); }
                      }
                      String shortText=text.length()>120 ? text.substring(0,120) : text;
                      println("S3E_FIELD_XREF data="+d.getAddress()+" matched="+matched+" refs="+localRefs+" callers="+callers+" value="+shortText);
                  }
                  DecompInterface decomp=new DecompInterface();
                  decomp.openProgram(currentProgram);
                  int total=0;
                  for (Map.Entry<String,Function> item : functions.entrySet()) {
                      if (total++>=100) { println("S3E_FUNCTION_CAP=100"); break; }
                      Function f=item.getValue();
                      Set<String> callees=new TreeSet<>();
                      InstructionIterator ii=currentProgram.getListing().getInstructions(f.getBody(),true);
                      while(ii.hasNext()) {
                          Instruction ins=ii.next();
                          if (!ins.getFlowType().isCall()) continue;
                          for(Address target:ins.getFlows()) {
                              Function callee=currentProgram.getFunctionManager().getFunctionAt(target);
                              if(callee==null) callee=currentProgram.getFunctionManager().getFunctionContaining(target);
                              if(callee!=null) callees.add(callee.getName());
                          }
                      }
                      DecompileResults dr=decomp.decompileFunction(f,30,monitor);
                      String status=dr!=null && dr.decompileCompleted() && dr.getDecompiledFunction()!=null ? "ok" : "failed_or_timeout";
                      int pseudocodeChars=(status.equals("ok") ? dr.getDecompiledFunction().getC().length() : 0);
                      println("S3E_FUNCTION entry="+f.getEntryPoint()+" name="+f.getName()+" bytes="+f.getBody().getNumAddresses()+" callees="+callees+" decompile="+status+" pseudocode_chars="+pseudocodeChars);
                  }
                  decomp.dispose();
                  println("S3E_XREF_AUDIT_DONE strings="+stringHits+" xrefs="+xrefHits+" functions="+functions.size()+" language="+currentProgram.getLanguageID());
              }
          }
          JAVA
          set +e
          "$GHIDRA_HOME/support/analyzeHeadless" "$RUNNER_TEMP/project" GunshipExtendedXref -import "$RUNNER_TEMP/code.bin" -loader BinaryLoader -processor 'AARCH64:LE:64:v8A' -loader-baseAddr "$S3E_BASE" -overwrite -max-cpu 2 -analysisTimeoutPerFile 1200 -scriptPath "$RUNNER_TEMP/scripts" -postScript ExtendedXrefAudit.java > "$RUNNER_TEMP/ghidra.log" 2>&1
          status=$?
          set -e
          echo "GHIDRA_EXIT=$status"
          grep -E 'S3E_|Exception|ERROR|Error|Failed' "$RUNNER_TEMP/ghidra.log" | tail -n 300 || true
          test "$status" -eq 0
          grep -q 'S3E_XREF_AUDIT_DONE' "$RUNNER_TEMP/ghidra.log"
