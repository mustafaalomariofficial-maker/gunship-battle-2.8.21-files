name: GUNSHIP S3E loader diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Download and verify Ghidra 11.2.1
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip'
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/ghidra.zip"
          echo 'ce4db5117da0fbaf8f33863fec4f40902f754f06b68945a59fb1c0f9b1bc461c  '"$RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          echo "GHIDRA_HOME=$RUNNER_TEMP/ghidra_11.2.1_PUBLIC" >> "$GITHUB_ENV"

      - name: Build and stage S3ELoader in documented extension locations
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/knot126/S3ELoader.git "$RUNNER_TEMP/S3ELoader"
          git -C "$RUNNER_TEMP/S3ELoader" checkout 9baf6261da1f35a2b1fea0cd95113d82535d2f04
          gradle --no-daemon -p "$RUNNER_TEMP/S3ELoader" -PGHIDRA_INSTALL_DIR="$GHIDRA_HOME" buildExtension
          zipfile="$(find "$RUNNER_TEMP/S3ELoader/dist" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$zipfile"
          mkdir -p "$RUNNER_TEMP/ext-stage"
          unzip -q "$zipfile" -d "$RUNNER_TEMP/ext-stage"
          properties="$(find "$RUNNER_TEMP/ext-stage" -type f -name extension.properties -print -quit)"
          test -n "$properties"
          module="$(dirname "$properties")"
          appdir="$GHIDRA_HOME/Ghidra/Extensions/S3ELoader"
          userhome="$RUNNER_TEMP/ghidra-user"
          userdir="$userhome/.config/ghidra/ghidra_11.2.1_PUBLIC/Extensions/S3ELoader"
          mkdir -p "$appdir" "$userdir"
          cp -a "$module/." "$appdir/"
          cp -a "$module/." "$userdir/"
          jarfile="$(find "$appdir" -type f -name '*.jar' -print -quit)"
          test -n "$jarfile"
          jar tf "$jarfile" | grep -Fxq 's3eloader/S3ELoaderLoader.class'
          test -f "$appdir/extension.properties" && test -f "$userdir/extension.properties"
          echo 'EXTENSION_LAYOUT_OK class=s3eloader/S3ELoaderLoader.class'
          echo "EXTENSION_JAR=$(basename "$jarfile")"
          echo 'EXTENSION_ARCHIVE_PATHS:'
          unzip -Z1 "$zipfile" | head -n 16
          echo "GHIDRA_USER_HOME=$userhome" >> "$GITHUB_ENV"

      - name: Download and validate the original XE3U input
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/mustafaalomariofficial-maker/gunship-battle-2.8.21-files/releases/download/v2.8.21-unmodified/com.theonegames.gunshipbattle_2.8.21.apk'
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/game.apk"
          python3 - "$RUNNER_TEMP/game.apk" "$RUNNER_TEMP/gunship.s3e" <<'PY'
          import hashlib,lzma,sys,zipfile
          apk,out=sys.argv[1:3]
          with zipfile.ZipFile(apk) as z: data=z.read('assets/GUNSHIP BATTLE_aarch64.s3e')
          if hashlib.sha256(data).hexdigest()!='caa3602b4287e22c2b7b62af00dfa67c7e1cf76f47e26753c3174aedf12acf03': raise SystemExit('APK_PAYLOAD_HASH_MISMATCH')
          try: payload=lzma.decompress(data,format=lzma.FORMAT_ALONE)
          except lzma.LZMAError:
              p=data[0]; lc=p%9; r=p//9; lp=r%5; pb=r//5; ds=int.from_bytes(data[1:5],'little')
              payload=lzma.decompress(data[13:],format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          digest=hashlib.sha256(payload).hexdigest()
          if not payload.startswith(b'XE3U') or digest!='6d0a0f004d52a249f1b7989f20a3d6e95d750de32169dc680444e4116fa2fa8a': raise SystemExit('XE3U_PAYLOAD_VALIDATION_FAILED')
          open(out,'wb').write(payload)
          print(f'S3E_INPUT_OK bytes={len(payload)} sha256={digest}')
          PY

      - name: Import with S3ELoader and print safe summary only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/project" "$RUNNER_TEMP/scripts"
          cat > "$RUNNER_TEMP/scripts/Summary.java" <<'JAVA'
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.listing.Function;
          public class Summary extends GhidraScript {
              public void run() throws Exception {
                  int n=0; for (Function f: currentProgram.getFunctionManager().getFunctions(true)) n++;
                  println("S3E_SUMMARY language="+currentProgram.getLanguageID()+" functions="+n+" min="+currentProgram.getMinAddress()+" max="+currentProgram.getMaxAddress());
              }
          }
          JAVA
          export JAVA_TOOL_OPTIONS="-Duser.home=$GHIDRA_USER_HOME -Dghidra.extensions.classpath.restricted=true -Djava.class.path.ext=$GHIDRA_HOME/Ghidra/Extensions/S3ELoader/lib/S3ELoader.jar"
          echo 'EXTENSION_CLASSPATH_ENABLED=1'
          set +e
          "$GHIDRA_HOME/support/analyzeHeadless" "$RUNNER_TEMP/project" Gunship -import "$RUNNER_TEMP/gunship.s3e" -loader S3ELoader -overwrite -max-cpu 2 -analysisTimeoutPerFile 900 -scriptPath "$RUNNER_TEMP/scripts" -postScript Summary.java > "$RUNNER_TEMP/ghidra.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/ghidra.log" "$status" <<'PY'
          import re,sys
          text=open(sys.argv[1],errors='replace').read(); status=int(sys.argv[2])
          lines=re.findall(r'S3E_SUMMARY[^\r\n]*',text)
          print(f'GHIDRA_EXIT={status}')
          if lines: print(lines[-1])
          else:
              print('GHIDRA_SUMMARY=not-produced')
              for line in text.splitlines():
                  if any(x in line for x in ('Exception','Caused by:','ERROR','Error','Failed','S3ELoader')):
                      line=re.sub(r'(/[A-Za-z0-9_.-]+){3,}','<path>',line)
                      line=re.sub(r'https?://\S+','<url-redacted>',line)
                      print('DIAGNOSTIC='+line[:240])
          if status or not lines: raise SystemExit('GHIDRA_IMPORT_OR_ANALYSIS_FAILED')
          PY