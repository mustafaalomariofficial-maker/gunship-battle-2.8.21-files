name: GUNSHIP S3E targeted function audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and verify Ghidra 11.2.1
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip'
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/ghidra.zip"
          echo 'ce4db5117da0fbaf8f33863fec4f40902f754f06b68945a59fb1c0f9b1bc461c  '"$RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          echo "GHIDRA_HOME=$RUNNER_TEMP/ghidra_11.2.1_PUBLIC" >> "$GITHUB_ENV"

      - name: Verify and extract the ARM64 code range
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/mustafaalomariofficial-maker/gunship-battle-2.8.21-files/releases/download/v2.8.21-unmodified/com.theonegames.gunshipbattle_2.8.21.apk'
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/game.apk"
          python3 - "$RUNNER_TEMP/game.apk" "$RUNNER_TEMP/code.bin" "$GITHUB_ENV" <<'PY'
          import hashlib, lzma, struct, sys, zipfile
          apk, code_path, env_path = sys.argv[1:]
          with zipfile.ZipFile(apk) as z:
              data = z.read('assets/GUNSHIP BATTLE_aarch64.s3e')
          if hashlib.sha256(data).hexdigest() != 'caa3602b4287e22c2b7b62af00dfa67c7e1cf76f47e26753c3174aedf12acf03':
              raise SystemExit('APK_PAYLOAD_HASH_MISMATCH')
          try:
              payload = lzma.decompress(data, format=lzma.FORMAT_ALONE)
          except lzma.LZMAError:
              p=data[0]; lc=p%9; r=p//9; lp=r%5; pb=r//5; ds=int.from_bytes(data[1:5],'little')
              payload=lzma.decompress(data[13:], format=lzma.FORMAT_RAW, filters=[{'id':lzma.FILTER_LZMA1,'dict_size':ds,'lc':lc,'lp':lp,'pb':pb}])
          if not payload.startswith(b'XE3U') or hashlib.sha256(payload).hexdigest() != '6d0a0f004d52a249f1b7989f20a3d6e95d750de32169dc680444e4116fa2fa8a':
              raise SystemExit('XE3U_PAYLOAD_VALIDATION_FAILED')
          arch=struct.unpack_from('<H',payload,10)[0]
          fields=struct.unpack_from('<14I',payload,12)
          code_off,code_size,base=fields[2],fields[3],fields[10]
          if arch & 0xff != 15 or not code_size or code_off+code_size>len(payload):
              raise SystemExit('XE3U_CODE_RANGE_OR_ARCH_INVALID')
          open(code_path,'wb').write(payload[code_off:code_off+code_size])
          with open(env_path,'a') as f: f.write(f'S3E_BASE=0x{base:x}\n')
          print(f'VERIFIED_XE3U_ARM64 bytes={len(payload)} code_bytes={code_size} base=0x{base:x}')
          PY

      - name: Decompile only functions referenced by progress, aircraft and network strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/project" "$RUNNER_TEMP/scripts"
          cat > "$RUNNER_TEMP/scripts/TargetFunctionAudit.java" <<'JAVA'
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.address.Address;
          import ghidra.program.model.listing.Data;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.Instruction;
          import ghidra.program.model.listing.InstructionIterator;
          import ghidra.program.model.symbol.Reference;
          import ghidra.program.model.symbol.ReferenceIterator;
          import java.util.LinkedHashMap;
          import java.util.LinkedHashSet;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.TreeSet;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class TargetFunctionAudit extends GhidraScript {
              public void run() throws Exception {
                  String[] wanted = {"RequestUseGold", "RequestBuyDiamond", "ResponseUserDiamond", "Request_Heli_Production", "Request_Buy_heli_gacha", "RequestLevelupWeapon", "RequestNetworkCheck", "RequestServerInfo", "GetPurchases", "JoypleBillingDoPay"};
                  Map<String, Map<String, Function>> found = new LinkedHashMap<>();
                  for (String w : wanted) found.put(w, new LinkedHashMap<>());
                  for (Data d : currentProgram.getListing().getDefinedData(true)) {
                      Object v;
                      try { v = d.getValue(); } catch (Exception e) { continue; }
                      if (!(v instanceof String)) continue;
                      String s = (String)v;
                      for (String w : wanted) {
                          if (!s.toLowerCase(Locale.ROOT).contains(w.toLowerCase(Locale.ROOT))) continue;
                          ReferenceIterator refs = currentProgram.getReferenceManager().getReferencesTo(d.getAddress());
                          while (refs.hasNext()) {
                              Reference r = refs.next();
                              Function f = currentProgram.getFunctionManager().getFunctionContaining(r.getFromAddress());
                              if (f != null) found.get(w).put(f.getEntryPoint().toString(), f);
                          }
                      }
                  }
                  Map<String, Set<String>> functions = new LinkedHashMap<>();
                  Map<String, Function> unique = new LinkedHashMap<>();
                  for (String w : wanted) {
                      Set<String> ids = new LinkedHashSet<>();
                      for (Function f : found.get(w).values()) {
                          String id = f.getEntryPoint().toString();
                          ids.add(id);
                          unique.put(id, f);
                      }
                      functions.put(w, ids);
                      println("S3E_TARGET_XREF target=" + w + " function_count=" + ids.size() + " entries=" + ids);
                  }
                  DecompInterface decomp = new DecompInterface();
                  decomp.openProgram(currentProgram);
                  Pattern callPattern = Pattern.compile("([A-Za-z_][A-Za-z0-9_:.]*)\\s*\\(");
                  int emitted = 0;
                  for (Map.Entry<String, Function> item : unique.entrySet()) {
                      if (emitted++ >= 80) { println("S3E_TARGET_TRUNCATED function_cap=80"); break; }
                      Function f = item.getValue();
                      Set<String> labels = new TreeSet<>();
                      for (String w : wanted) if (functions.get(w).contains(item.getKey())) labels.add(w);
                      Set<String> calls = new TreeSet<>();
                      InstructionIterator instructions = currentProgram.getListing().getInstructions(f.getBody(), true);
                      while (instructions.hasNext()) {
                          Instruction ins = instructions.next();
                          if (!ins.getFlowType().isCall()) continue;
                          for (Address target : ins.getFlows()) {
                              Function callee = currentProgram.getFunctionManager().getFunctionAt(target);
                              if (callee == null) callee = currentProgram.getFunctionManager().getFunctionContaining(target);
                              if (callee != null) calls.add(callee.getName());
                          }
                      }
                      String status = "unavailable";
                      Set<String> highCalls = new TreeSet<>();
                      DecompileResults result = decomp.decompileFunction(f, 45, monitor);
                      if (result != null && result.decompileCompleted() && result.getDecompiledFunction() != null) {
                          status = "ok";
                          String c = result.getDecompiledFunction().getC();
                          Matcher matcher = callPattern.matcher(c);
                          while (matcher.find()) {
                              String name = matcher.group(1);
                              if (!name.equals("if") && !name.equals("while") && !name.equals("switch") && !name.equals("sizeof") && !name.equals("return")) highCalls.add(name);
                          }
                      }
                      println("S3E_TARGET_FUNCTION entry=" + f.getEntryPoint() + " name=" + f.getName() + " bytes=" + f.getBody().getNumAddresses() + " strings=" + labels + " direct_callees=" + calls + " decompiler_calls=" + highCalls + " decompile=" + status);
                  }
                  decomp.dispose();
                  println("S3E_TARGET_AUDIT_DONE unique_functions=" + unique.size() + " language=" + currentProgram.getLanguageID());
              }
          }
          JAVA
          set +e
          "$GHIDRA_HOME/support/analyzeHeadless" "$RUNNER_TEMP/project" GunshipTargetAudit -import "$RUNNER_TEMP/code.bin" -loader BinaryLoader -processor 'AARCH64:LE:64:v8A' -loader-baseAddr "$S3E_BASE" -overwrite -max-cpu 2 -analysisTimeoutPerFile 1200 -scriptPath "$RUNNER_TEMP/scripts" -postScript TargetFunctionAudit.java > "$RUNNER_TEMP/ghidra.log" 2>&1
          status=$?
          set -e
          echo "GHIDRA_EXIT=$status"
          grep -E '^S3E_TARGET_|Exception|ERROR|Error|Failed' "$RUNNER_TEMP/ghidra.log" | tail -n 240 || true
          test "$status" -eq 0
          grep -q 'S3E_TARGET_AUDIT_DONE' "$RUNNER_TEMP/ghidra.log"
